# Rebuilds packs.json (the Workshop's pack list) whenever packs change.
name: Build pack list

on:
  push:
    branches: [main]
    paths-ignore: [packs.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit messages are the titles and descriptions

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node .github/scripts/build-packs.mjs

      - name: Commit packs.json if it changed
        run: |
          git add packs.json
          if git diff --cached --quiet; then
            echo "packs.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update packs.json"
          git push
